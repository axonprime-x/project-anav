<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project ANAV // Live Telemetry HUD</title>
    <style>
        body { background: #0b0f17; color: #f8fafc; font-family: monospace; margin: 0; padding: 20px; }
        h1 { color: #38bdf8; font-size: 20px; text-transform: uppercase; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Project ANAV // Sovereign Node Control Matrix</h1>
    <p>Node ID: <strong>node_master_01</strong> | Treasury: <code>0x0266c60Ba4F5B883d970300ca18ff598e77636D5</code></p>

    <!-- DUAL TELEMETRY FEEDS: LOCAL CYCLES VS GLOBAL TRANSACTIONS -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
      <div style="background: #111418; border: 1px solid #1f2937; border-radius: 8px; padding: 16px;">
        <h3 style="color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-top: 0;">Local Daemon Execution Cycles</h3>
        <div id="local-daemon-feed" style="font-size: 12px; color: #38bdf8; max-height: 350px; overflow-y: auto;">
          Loading local cycles...
        </div>
      </div>
      <div style="background: #111418; border: 1px solid #1f2937; border-radius: 8px; padding: 16px;">
        <h3 style="color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-top: 0;">Global Transactions & Ingress Pings</h3>
        <div id="global-tx-feed" style="font-size: 12px; color: #4ade80; max-height: 350px; overflow-y: auto;">
          Loading global transactions...
        </div>
      </div>
    </div>

    <script>
    async function refreshGlobalTx() {
      try {
        const res = await fetch('/api/global-transactions');
        const data = await res.json();
        const container = document.getElementById('global-tx-feed');
        if (data.length > 0) {
          container.innerHTML = data.slice(0, 15).map(tx => {
            const net = tx.payload.network || tx.payload.node_id || tx.payload.agent || 'Direct-Ingress';
            const st = tx.payload.status || tx.payload.purpose || 'SETTLED';
            return '<div style="border-bottom: 1px solid #1e293b; padding: 6px 0;">' +
              '<span style="color: #f59e0b;">[' + new Date(tx.timestamp * 1000).toLocaleTimeString() + ']</span> ' +
              '<strong>' + net + '</strong>: ' + st + ' ' +
              (tx.amount_usdc > 0 ? '<span style="color: #22c55e;">(+' + tx.amount_usdc + ' USDC)</span>' : '') +
              '</div>';
          }).join('');
        }
      } catch (e) {
        console.error('Failed to poll global tx:', e);
      }
    }
    setInterval(refreshGlobalTx, 3000);
    refreshGlobalTx();
    </script>
</body>
</html>
